<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A phone-first About page for Skool: two working demos</title>
<style>
:root{--bg:#1c1c1e;--card:#2a2a2d;--line:#3a3a3e;--text:#f1f1f3;--dim:#a6a6ad;--gold:#f8d481}
*{box-sizing:border-box}
body{margin:0;background:#0e0e10;color:var(--text);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:40px 20px 70px}
.k{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
h1{font-size:34px;line-height:1.15;margin:10px 0 14px}
p{font-size:19px;color:#dcdce0;margin:0 0 14px}
.vid{position:relative;aspect-ratio:16/9;background:#000;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;margin:18px 0 22px;overflow:hidden}
.vid div{text-align:center;color:var(--dim);font-size:18px;font-weight:700}
.vid svg{width:64px;height:64px;display:block;margin:0 auto 10px;fill:var(--gold)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 12px}
.two a{display:block;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px;color:var(--text);text-decoration:none}
.two a:hover{border-color:var(--gold)}
.two b{display:block;font-size:24px;margin-bottom:6px}
.two span{font-size:17px;color:var(--dim)}
.two i{display:inline-block;margin-top:10px;font-style:normal;font-weight:800;background:var(--gold);color:#1c1c1e;padding:10px 18px;border-radius:10px}
.tip{font-size:16px;color:var(--dim)}
h2{font-size:22px;margin:36px 0 12px}
ol{margin:0;padding-left:22px}
li{font-size:18px;color:#dcdce0;margin-bottom:12px}
li b{color:var(--text)}
.by{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);font-size:17px;color:var(--dim)}
@media (max-width:640px){.two{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<main>
  <div class="k">A suggestion from a group owner</div>
  <h1>The Skool About page, built for the phone first</h1>
  <div class="vid" id="loom"><div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" opacity=".25"/><path d="M10 8l6 4-6 4z"/></svg>The 3 minute video goes here</div></div>
  <div class="two">
    <a href="https://stevenjamesconsulting.com/go/skool-demo-phone" target="_blank" rel="noopener"><b>Phone demo</b><i>Open the phone demo</i></a>
    <a href="https://stevenjamesconsulting.com/go/skool-demo-tablet" target="_blank" rel="noopener"><b>Tablet demo</b><i>Open the tablet demo</i></a>
  </div>
</main>
</body>
</html>
